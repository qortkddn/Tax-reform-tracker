# 매주 월요일 아침(한국 시간 7시)에 시뮬레이터가 쓰는 법령을 확인합니다.
# 1) 개정 감지: 공공데이터포털 '법제처 국가법령정보 공유서비스' (Secret: LAW_KEY = 일반 인증키 Decoding)
#    → 공포일자·시행일자가 바뀌면 data/law_changes.md를 남기고 실패로 표시(메일 알림)
# 2) 조문 본문 수집: 법제처 Open API (Secret: LAW_OC, 있을 때만)
name: 법령 확인
on:
  schedule: [{cron: "0 22 * * 0"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 개정 감지 (공공데이터포털)
        id: meta
        run: python3 scripts/check_law_updates.py
        continue-on-error: true
        env: {LAW_KEY: "${{ secrets.LAW_KEY }}"}
      - name: 조문 본문 수집 (법제처 Open API, LAW_OC가 있을 때만)
        run: if [ -n "$LAW_OC" ]; then python3 scripts/fetch_laws.py; else echo "LAW_OC 없음 — 건너뜀"; fi
        env: {LAW_OC: "${{ secrets.LAW_OC }}"}
      - name: 결과 커밋
        run: |
          git config user.name "law-bot"; git config user.email "law-bot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "법령 확인 $(TZ=Asia/Seoul date +%Y.%m.%d)" && git push)
      - name: 개정이 감지되면 실패로 표시 (알림용)
        if: steps.meta.outcome == 'failure'
        run: cat data/law_changes.md 2>/dev/null; exit 1
